<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SkillTrack — Learn · Practice · Analyze · Improve</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#0f1b3d;--mu:#5b6785;--bd:#dbe2f0;--pr:#1d5fd6;--gr:#0f8a4a;--rd:#d23b3b;--am:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060c1e;--card:#0d1630;--tx:#e8eeff;--mu:#93a1c6;--bd:#1e2b52;--pr:#4d8dff;--gr:#3ddc84;--rd:#ff6b6b;--am:#f5b84a}}
:root[data-theme="dark"]{--bg:#060c1e;--card:#0d1630;--tx:#e8eeff;--mu:#93a1c6;--bd:#1e2b52;--pr:#4d8dff;--gr:#3ddc84;--rd:#ff6b6b;--am:#f5b84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--tx);font-size:18px}.lg img{height:40px;width:40px;border-radius:8px;background:#000}.lg span{color:var(--gr)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}nav a{padding:6px 12px;border-radius:8px;color:var(--mu);text-decoration:none;white-space:nowrap}nav a.on{background:var(--pr);color:#fff}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px}h1{margin:.2em 0}h3{margin:.2em 0 .6em}.mu{color:var(--mu)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.g .c{margin:0}.big{font-size:28px;font-weight:700}
.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
.b:hover,.opt:hover{border-color:var(--pr)}.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 15%,transparent)}.ok{border-color:var(--gr)!important;background:color-mix(in srgb,var(--gr) 18%,transparent)}.no{border-color:var(--rd)!important;background:color-mix(in srgb,var(--rd) 15%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{padding:2px 10px;border-radius:99px;border:1px solid var(--bd);font-size:13px}.q{font-size:18px;font-weight:600}
.br{display:grid;grid-template-columns:minmax(110px,1.2fr) 3fr minmax(80px,1fr);gap:10px;align-items:center;margin:8px 0;font-size:14px}.br i{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.br u{display:block;height:100%}
.nv{display:flex;flex-wrap:wrap;gap:6px}.nv button{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer}.nv .a{background:var(--pr);color:#fff}.nv .m{outline:2px solid var(--am)}.nv .cur{border-color:var(--tx);border-width:2px}
input,select,textarea{width:100%;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}textarea{font-family:ui-monospace,Menlo,monospace;min-height:170px}
.gr{color:var(--gr)}.am{color:var(--am)}.rd{color:var(--rd)}.focus header{display:none}.ob{max-width:460px;margin:auto;text-align:center}.ob img{height:130px;border-radius:16px;background:#000}.ob form{text-align:left}
@media(max-width:560px){.br{grid-template-columns:1fr}}

["Quantitative Aptitude","12 workers finish a task in 8 days. How many days will 16 workers take?","6","5","7","10","Work = 96 worker-days; 96 ÷ 16 = 6."],
["Quantitative Aptitude","An item bought for ₹200 is sold at 25% profit. Selling price?","₹250","₹225","₹240","₹260","200 × 1.25 = 250."],
["Quantitative Aptitude","Cost price ₹500, selling price ₹450. Loss percentage?","10%","5%","12%","11%","Loss 50 ÷ 500 = 10%."],
["Logical Reasoning","Series: 2, 6, 12, 20, ?","30","28","32","24","Differences are 4, 6, 8, 10 → 20 + 10 = 30."],
["Logical Reasoning","Series: 3, 6, 12, 24, ?","48","36","30","42","Each term doubles."],
["Logical Reasoning","A is B's sister and B is C's father. A is C's what?","Aunt","Mother","Grandmother","Cousin","The father's sister is the child's paternal aunt."],
["Logical Reasoning","Walk 3 km north then 4 km east. Straight-line distance from the start?","5 km","7 km","6 km","4 km","Pythagoras: √(3²+4²) = 5."],
["Verbal Ability","Neither of the answers ___ correct.","is","are","were","be","'Neither' is singular, so it takes 'is'."],
["Verbal Ability","Synonym of 'benevolent':","Kind","Cruel","Lazy","Angry","Benevolent means well-meaning and kind."],
["Verbal Ability","She ___ to the library every day.","goes","go","going","gone","Third-person singular present: 'goes'."],
["SQL & DBMS","Which SQL clause filters groups after GROUP BY?","HAVING","WHERE","ORDER BY","LIMIT","WHERE filters rows before grouping; HAVING filters groups."],
["SQL & DBMS","Which join keeps all rows from the left table even without a match?","LEFT JOIN","INNER JOIN","CROSS JOIN","SELF JOIN","LEFT JOIN returns every left row, with NULLs when unmatched."],
["SQL & DBMS","Which normal form removes partial dependencies?","2NF","1NF","3NF","BCNF","2NF requires no partial dependency on a composite key."],
["Java & OOP","Which keyword stops a method from being overridden?","final","static","abstract","volatile","A final method cannot be overridden by subclasses."],
["Java & OOP","Method overloading is an example of:","Compile-time polymorphism","Runtime polymorphism","Encapsulation","Inheritance","Overloads are resolved at compile time."],
["Operating Systems","Processes waiting forever on each other's resources is called:","Deadlock","Starvation","Thrashing","Paging","Circular wait among holders is a deadlock."],

let S=load();const save=()=>{try{localStorage.setItem("skilltrack1",JSON.stringify(S))}catch(e){}};
const day=()=>new Date().toISOString().slice(0,10),pct=(c,n)=>n?Math.round(100*c/n):0;
const cls=p=>p>=80?["Strong","gr"]:p>=65?["Good","gr"]:p>=50?["Average","am"]:p>=35?["Needs Practice","am"]:["Needs Improvement","rd"];

function stats(){const t={};TOP.forEach(x=>t[x]={n:0,c:0});S.log.forEach(l=>{const o=t[Q[l.q][0]];o.n++;if(l.ok)o.c++});return t}
function streak(){let n=0,d=new Date();if(!S.days.includes(day()))d.setDate(d.getDate()-1);while(S.days.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function ready(){const t=stats(),f=L=>{let n=0,c=0;L.forEach(x=>{n+=t[x].n;c+=t[x].c});return n>=MIN?pct(c,n):null};
const comp=[["Aptitude",.35,f(APT)],["Technical",.35,f(TOP.filter(x=>!APT.includes(x)))],["Mock tests",.2,S.tests.length?Math.round(S.tests.reduce((a,x)=>a+x.pct,0)/S.tests.length):null],["Consistency",.1,S.days.length?Math.min(100,Math.round(100*S.days.length/7)):null]];

// ---------- dashboard
function trend(){const a=S.tests.slice(-8).map(t=>t.pct);if(a.length<2)return`<p class="mu">Complete 2+ tests to see your score trend.</p>`;
return`<svg viewBox="0 0 300 80" width="100%" role="img" aria-label="Test score trend"><polyline fill="none" stroke="var(--pr)" stroke-width="3" points="${a.map((v,i)=>`${10+i*280/(a.length-1)},${72-v*.64}`).join(" ")}"/></svg>`}
function dash(){const t=stats(),R=ready(),L=S.log,ok=L.filter(x=>x.ok).length,d=S.p.domain,tasks=RM[d].map((x,i)=>[x.split("|")[0],i]).filter(([x,i])=>!S.done[d+i]).slice(0,2);
const weak=TOP.filter(x=>t[x].n>=MIN).sort((a,b)=>pct(t[a].c,t[a].n)-pct(t[b].c,t[b].n)).slice(0,2);
M.innerHTML=`<h1>Hi ${esc(S.p.name)} 👋</h1><p class="mu">${esc(d)} · ${S.p.level}${S.p.college?" · "+esc(S.p.college):""}</p>
${!L.length&&!S.tests.length?`<div class="c"><h3>Start your first assessment</h3><p>Your dashboard is built from your real activity. Take the 10-question initial assessment to begin.</p><a class="b pr" href="#/test">Start initial assessment</a></div>`:""}
<div class="g">${card("Readiness indicator",R.score==null?"—":R.score+"%","preparation indicator, not a job-offer probability")}${card("Questions attempted",L.length,ok+" correct")}${card("Tests completed",S.tests.length)}${card("Streak",streak()+" d")}${card("XP",S.xp)}</div>
<div class="c"><h3>Topic accuracy</h3>${TOP.map(x=>t[x].n?bar(x,pct(t[x].c,t[x].n),t[x].c+"/"+t[x].n):"").join("")||`<p class="mu">No attempts yet.</p>`}</div>
<div class="c"><h3>Assessment score trend</h3>${trend()}</div>
<div class="g"><div class="c"><h3>Today's tasks</h3>${tasks.map(([x,i])=>`<p>▢ ${x}</p>`).join("")||"<p>All roadmap tasks done 🎉</p>"}<a class="b" href="#/road">Open roadmap</a></div>
<div class="c"><h3>Weakest topics</h3>${weak.map(x=>`<p>${x} — <b class="${cls(pct(t[x].c,t[x].n))[1]}">${pct(t[x].c,t[x].n)}%</b></p>`).join("")||`<p class="mu">Needs ${MIN}+ attempts per topic.</p>`}<a class="b" href="#/skills">Skill analysis</a></div></div>
<p class="mu"><small>Demo mode: progress is stored in this browser. The AI coach and sandboxed code execution need server-side keys (LLM provider, Judge0) and are not connected here. Question bank is sample content.</small></p>`}
// ---------- practice
let P={t:"All",qi:null,o:null,pick:null};
function nextQ(){const pool=Q.map((q,i)=>i).filter(i=>(P.t==="All"||Q[i][0]===P.t)&&i!==P.qi);P.qi=pool[Math.floor(Math.random()*pool.length)];P.o=perm();P.pick=null}
function practice(){if(P.qi==null)nextQ();const q=Q[P.qi];
M.innerHTML=`<h1>Practice</h1><div class="row">${["All",...TOP].map(x=>`<button class="b ${P.t===x?"pr":""}" onclick="P.t='${x}';P.qi=null;practice()">${x}</button>`).join("")}</div>
<div class="c"><span class="tag">${q[0]}</span><p class="q">${q[1]}</p>${P.o.map((k,j)=>`<button class="opt ${P.pick==null?"":k===0?"ok":P.pick===j?"no":""}" ${P.pick!=null?"disabled":""} onclick="pick(${j})">${esc(q[2+k])}</button>`).join("")}
${P.pick!=null?`<p><b>${P.o[P.pick]===0?"Correct ✓":"Incorrect ✗"}</b> — ${q[6]}</p><button class="b pr" onclick="nextQ();practice()">Next question</button>`:""}</div>`}
function pick(j){P.pick=j;rec(P.qi,P.o[j]===0);save();practice()}
// ---------- mock test
const NQ=10,DUR=600;
function test(){document.body.classList.remove("focus");
if(S.act){return tview()}
M.innerHTML=`<h1>Mock test</h1><div class="c"><h3>Instructions</h3><ul><li>${NQ} randomly selected questions across aptitude and technical topics.</li><li>${DUR/60} minutes. The test auto-submits when time runs out.</li><li>+1 per correct answer, −0.25 per wrong answer, 0 for skipped.</li><li>Answers and explanations are hidden until you submit. Answers autosave.</li><li>Accuracy = correct ÷ attempted; skipped questions are reported separately.</li></ul>
<button class="b pr" onclick="begin()">Start test</button></div>${S.tests.length?`<p><a href="#/result/${S.tests.length-1}">View last result</a></p>`:""}`}
function begin(){const ids=Q.map((q,i)=>i).sort(()=>Math.random()-.5).slice(0,NQ);S.act={qs:ids.map(qi=>({qi,o:perm()})),a:{},mk:{},i:0,end:Date.now()+DUR*1000,t0:Date.now()};save();tview()}
function tview(){const T=S.act,n=T.qs.length,c=T.qs[T.i],q=Q[c.qi];document.body.classList.add("focus");clearInterval(TM);
const un=T.qs.filter((x,i)=>T.a[i]==null).length;
M.innerHTML=`<div class="c top"><b>Question ${T.i+1} of ${n}</b><span class="tag" id="tm"></span><button class="b" onclick="mk()">${T.mk[T.i]?"★ Marked for review":"☆ Mark for review"}</button></div>
<div class="c"><p class="q">${q[1]}</p>${c.o.map((k,j)=>`<button class="opt ${T.a[T.i]===j?"sel":""}" onclick="ans(${j})">${esc(q[2+k])}</button>`).join("")}
<div class="row"><button class="b" onclick="go(-1)">Previous</button><button class="b" onclick="go(1)">Next</button><button class="b" onclick="clr()">Clear answer</button></div></div>
<div class="c"><div class="nv">${T.qs.map((x,i)=>`<button class="${T.a[i]!=null?"a":""} ${T.mk[i]?"m":""} ${i===T.i?"cur":""}" onclick="jump(${i})" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
<p class="mu"><small>Blue = answered · amber outline = marked · ${un} unanswered</small></p><button class="b pr" onclick="sub()">${T.cf?`Confirm submit (${un} unanswered)`:"Submit test"}</button></div>`;
tick();TM=setInterval(tick,1000)}
function tick(){if(!S.act)return;const r=Math.ceil((S.act.end-Date.now())/1000);if(r<=0){finish();return}const e=$("#tm");if(e)e.textContent="⏱ "+Math.floor(r/60)+":"+String(r%60).padStart(2,"0")}
const ans=j=>{S.act.a[S.act.i]=j;S.act.cf=0;save();tview()},clr=()=>{delete S.act.a[S.act.i];save();tview()},mk=()=>{S.act.mk[S.act.i]=!S.act.mk[S.act.i];save();tview()},go=d=>jump(Math.min(NQ-1,Math.max(0,S.act.i+d))),jump=i=>{S.act.i=i;S.act.cf=0;save();tview()};
function sub(){if(!S.act.cf){S.act.cf=1;tview();return}finish()}
function finish(){const T=S.act;if(!T)return;S.act=null;clearInterval(TM);let sc=0,ok=0,att=0;const wr=[],tp={};
T.qs.forEach((c,i)=>{const q=Q[c.qi],a=T.a[i];if(a==null){wr.push([c.qi,null]);return}att++;const good=c.o[a]===0;tp[q[0]]=tp[q[0]]||[0,0];tp[q[0]][1]++;rec(c.qi,good);if(good){ok++;sc++;tp[q[0]][0]++}else{sc-=.25;wr.push([c.qi,c.o[a]])}});
S.tests.push({ts:Date.now(),max:T.qs.length,score:sc,ok,att,wr,tp,secs:Math.min(DUR,Math.round((Date.now()-T.t0)/1000)),pct:Math.max(0,Math.round(100*sc/T.qs.length))});S.xp+=20;save();
document.body.classList.remove("focus");location.hash="#/result/"+(S.tests.length-1);route()}
function result(i){const k=i==null?S.tests.length-1:+i,T=S.tests[k];if(!T){location.hash="#/test";return}const pv=S.tests[k-1];
M.innerHTML=`<h1>Test result</h1><div class="g">${card("Score",T.score.toFixed(2)+" / "+T.max)}${card("Percentage",T.pct+"%")}${card("Accuracy",pct(T.ok,T.att)+"%","correct ÷ attempted ("+T.ok+"/"+T.att+")")}${card("Skipped",T.max-T.att)}${card("Time",fmt(T.secs),"avg "+Math.round(T.secs/T.max)+"s / question")}</div>
${pv?`<p class="mu">Previous attempt (same 10-question mixed format, same scoring): ${pv.pct}% → ${T.pct}% (${T.pct-pv.pct>=0?"+":""}${T.pct-pv.pct} pts). Question sets are random, so treat small changes as noise.</p>`:""}
<div class="c"><h3>Topic performance (attempted questions)</h3>${Object.entries(T.tp).map(([x,v])=>bar(x,pct(v[0],v[1]),v[0]+"/"+v[1])).join("")||"<p>No questions attempted.</p>"}</div>
<div class="c"><h3>Incorrect or skipped</h3>${T.wr.length?T.wr.map(w=>{const q=Q[w[0]];return`<p><b>${q[1]}</b><br>Your answer: ${w[1]==null?"skipped":esc(q[2+w[1]])} · Correct: <b class="gr">${esc(q[2])}</b><br><span class="mu">${q[6]}</span></p>`}).join(""):"<p>Everything correct 🎉</p>"}</div>
<a class="b pr" href="#/test">Take another test</a> <a class="b" href="#/skills">Skill analysis</a>`}
// ---------- skills
function skills(){const t=stats(),R=ready();
M.innerHTML=`<h1>Skill analysis</h1><p class="mu">Measured from your answers. A topic needs ${MIN}+ attempts before it gets a rating; thresholds: ≥80 Strong, ≥65 Good, ≥50 Average, ≥35 Needs Practice, else Needs Improvement.</p>
<div class="c">${TOP.map(x=>{const o=t[x];if(o.n<MIN)return`<div class="br"><span>${x}</span><span class="mu">Insufficient data (${o.n}/${MIN} attempts)</span><span></span></div>`;const p=pct(o.c,o.n),k=cls(p);return bar(x,p,k[0]+" · "+o.c+"/"+o.n)}).join("")}</div>
${TOP.filter(x=>t[x].n>=MIN&&pct(t[x].c,t[x].n)<65).map(x=>`<div class="c"><b>${x}</b><p><span class="tag">Measured</span> ${t[x].c} of ${t[x].n} answers correct.</p><p><span class="tag">Suggestion (rule-based)</span> Review the explanations for missed ${x} questions, then do 5 more practice questions. Relevant to your ${esc(S.p.domain)} goal.</p><button class="b" onclick="P.t='${x}';P.qi=null;location.hash='#/practice'">Practice ${x}</button></div>`).join("")}
<div class="c"><h3>Readiness indicator: ${R.score==null?"not enough evidence":R.score+"%"}</h3><p class="mu">Weighted average of components that have evidence. A preparation indicator, not a prediction of any hiring outcome.</p>
${R.comp.map(c=>c[2]==null?`<div class="br"><span>${c[0]} (${c[1]*100}%)</span><span class="mu">Missing evidence</span><span></span></div>`:bar(c[0]+" ("+c[1]*100+"%)",c[2])).join("")}</div>`}
// ---------- roadmap
function road(){const d=S.p.domain,L=RM[d],done=L.filter((x,i)=>S.done[d+i]).length;
M.innerHTML=`<h1>Roadmap</h1><label>Career domain<select onchange="S.p.domain=this.value;save();road()">${Object.keys(RM).map(k=>`<option ${k===d?"selected":""}>${k}</option>`).join("")}</select></label>
${bar("Progress",pct(done,L.length),done+"/"+L.length)}
${L.map((x,i)=>{const [t,h,a]=x.split("|");return`<div class="c row"><input type="checkbox" style="width:22px;margin:0" ${S.done[d+i]?"checked":""} onchange="S.done['${d}${i}']=this.checked;save();road()" aria-label="Complete ${t}"><div style="flex:1"><b>${t}</b><br><small class="mu">~${h} h${a&&a!=="test"?" · practice: "+a:""}</small></div>${a==="test"?`<a class="b" href="#/test">Mock test</a>`:a?`<button class="b" onclick="P.t='${a}';P.qi=null;location.hash='#/practice'">Practice</button>`:""}</div>`}).join("")}
<p class="mu"><small>Each domain has its own track. Resource links are not included in this demo; add official sources when you connect the content database.</small></p>`}
// ---------- code studio
let HI=0;const HINTS=["Hint 1: Strings are sequences — you can walk from the last character to the first.","Hint 2: Build a new string by appending characters in reverse order, or use two pointers swapping ends.","Hint 3: Python: s[::-1] · Java: new StringBuilder(s).reverse() — try writing the loop yourself first."];
const STARTER={Python:"def solve(s):\n    # return s reversed\n    pass\n","Java":"class Solution {\n  static String solve(String s) {\n    // return s reversed\n    return s;\n  }\n}\n","C++":"#include <string>\nstd::string solve(std::string s){\n  // return s reversed\n  return s;\n}\n","C":"// void solve(char *s): reverse s in place\n"};
function code(){M.innerHTML=`<h1>Code studio</h1><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="c"><span class="tag">Easy</span> <span class="tag">Arrays &amp; strings</span><h3>P-001 · Reverse a string</h3><p>Given a string <code>s</code>, return it reversed.</p><p><b>Example:</b> <code>"hello"</code> → <code>"olleh"</code><br><b>Constraints:</b> 0 ≤ |s| ≤ 10⁵</p>
<button class="b" onclick="HI=Math.min(3,HI+1);code()">Show hint (${HI}/3)</button>${HINTS.slice(0,HI).map(h=>`<p class="mu">${h}</p>`).join("")}</div>
<div class="c"><select id="lg" onchange="$('#ed').value=STARTER[this.value]">${Object.keys(STARTER).map(k=>`<option>${k}</option>`).join("")}</select><textarea id="ed" spellcheck="false" aria-label="Code editor">${STARTER.Python}</textarea>
<div class="row"><button class="b" onclick="run()">Run code</button><button class="b pr" onclick="run()">Submit solution</button></div><div id="out" class="mu" style="margin-top:10px" role="status"></div></div></div>`}
function run(){$("#out").innerHTML=`<b class="am">Code execution isn't configured.</b> Student code is never run in the browser or on the app server. Connect a sandboxed service such as Judge0 through a server-side function (with timeouts, memory limits and rate limits) to enable Run and Submit with hidden test cases.`}
// ---------- router
function route(){clearInterval(TM);document.body.classList.remove("focus");if(!S.p)return onboard();
const [h,a]=(location.hash.slice(2)||"dash").split("/");$("#nv").innerHTML=NAV.map(([k,l])=>`<a href="#/${k}" class="${k===h?"on":""}">${l}</a>`).join("");
({dash,practice,test,result,skills,road,code}[h]||dash)(a);scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
